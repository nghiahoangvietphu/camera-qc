<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="referrer" content="no-referrer">
<title>Camera QC — Việt Phú</title>
<style>
  :root {
    --nen: #0b0d10; --chu: #f6f7f9; --mo: #9aa3af;
    --chinh: #16a34a; --chinh-nhan: #22c55e;
    --phu: rgba(255,255,255,.14); --vien: rgba(255,255,255,.22);
    --canh: #dc2626; --vang: #d97706;
    --an-toan-duoi: env(safe-area-inset-bottom, 0px);
    --an-toan-tren: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--nen); color: var(--chu);
    font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #san { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* --- Vung hinh: video truc tiep hoac anh da dong dau --- */
  #khung { position: relative; flex: 1; min-height: 0; background: #000; }
  #video, #anh {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #anh { display: none; }
  #video.day { object-fit: cover; }

  /* --- Thanh tren: ma phieu, vai tro, dinh vi --- */
  #tren {
    position: absolute; left: 0; right: 0; top: 0; z-index: 3;
    padding: calc(var(--an-toan-tren) + 10px) 12px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,0));
    display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  #nhanPhieu { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  #nhanPhieu span { color: var(--mo); font-weight: 400; }
  .chip {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    max-width: 100%; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.5); border: 1px solid var(--vien);
    font-size: 12.5px; line-height: 1.3;
  }
  .chip b { width: 7px; height: 7px; border-radius: 50%; background: var(--mo); flex: none; }
  .chip.ok b { background: var(--chinh-nhan); }
  .chip.cho b { background: var(--vang); }
  .chip.khong b { background: var(--canh); }
  .chip u { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- Thanh duoi: dieu khien --- */
  /* Vung thao tac: HAI hang. Hang tren doi theo trang thai (nut chup, hoac
     Chup lai / Luu QC); hang duoi la nut quay ve, dung yen.
     padding-bottom da gom safe-area nen nut khong bi thanh cong cu che. */
  #duoi {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 18px 16px calc(var(--an-toan-duoi) + 18px);
    background: linear-gradient(0deg, rgba(0,0,0,.84), rgba(0,0,0,0));
    display: flex; flex-direction: column; gap: 12px;
  }
  #duoiChinh { display: flex; align-items: center; justify-content: center; gap: 14px; }
  /* `.nut` co flex:1 1 0 — trong cot thi no se gian cao ra, phai tat di. */
  #quayVe { flex: none; width: 100%; min-height: 48px; font-size: 16px; }
  #quayVe:disabled { opacity: .5; }
  #chup {
    width: 78px; height: 78px; border-radius: 50%; flex: none;
    background: #fff; border: 5px solid rgba(255,255,255,.38);
    box-shadow: 0 2px 18px rgba(0,0,0,.5);
  }
  #chup:active { transform: scale(.94); }
  #chup:disabled { opacity: .4; }
  .nut {
    flex: 1 1 0; min-height: 56px; padding: 14px 16px; border-radius: 14px;
    font: 600 17px/1.2 inherit; color: var(--chu);
    background: var(--phu); border: 1px solid var(--vien);
  }
  .nut-chinh { background: var(--chinh); border-color: var(--chinh); }
  .nut:active { transform: scale(.985); }
  .nut:disabled { opacity: .5; }
  #demAnh { position: absolute; right: 16px; bottom: calc(var(--an-toan-duoi) + 34px);
            font-size: 13px; color: var(--mo); }
  /* Khi hang quay ve hien ra, vung thao tac cao them ~60px — nhac bo dem len
     cho khoi de chong len nut. */
  #duoi.co-quay-ve ~ #demAnh { bottom: calc(var(--an-toan-duoi) + 94px); }

  /* --- Che phu: dang luu / loi / huong dan --- */
  #che {
    position: absolute; inset: 0; z-index: 5; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(5,7,10,.93); text-align: center;
  }
  #che.hien { display: flex; }
  #cheTrong { max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  #cheTieuDe { font-size: 19px; font-weight: 700; }
  #cheChu { color: var(--mo); font-size: 15px; white-space: pre-line; }
  .vong {
    width: 34px; height: 34px; margin: 0 auto; border-radius: 50%;
    border: 3px solid var(--phu); border-top-color: var(--chinh-nhan);
    animation: quay .8s linear infinite;
  }
  @keyframes quay { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .vong { animation-duration: 2.4s; } }

  #banh {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 6;
    bottom: calc(var(--an-toan-duoi) + 110px); max-width: calc(100% - 32px);
    padding: 11px 16px; border-radius: 12px; background: rgba(12,15,20,.95);
    border: 1px solid var(--vien); font-size: 14.5px; text-align: center;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  #banh.hien { opacity: 1; }
  #banh.loi { border-color: var(--canh); }
</style>
</head>
<body>
<div id="san">
  <div id="khung">
    <video id="video" playsinline autoplay muted></video>
    <img id="anh" alt="Ảnh vừa chụp, đã đóng dấu thông tin ghi hình">

    <div id="tren">
      <div id="nhanPhieu">—</div>
      <div class="chip" id="chipGps"><b></b><u>Đang xác định vị trí…</u></div>
    </div>

    <div id="duoi">
      <div id="duoiChinh"></div>
      <button class="nut" id="quayVe" type="button" data-quay-ve hidden>← Quay về QA/QC</button>
    </div>
    <div id="demAnh"></div>
    <div id="banh"></div>
  </div>

  <div id="che" class="hien">
    <div id="cheTrong">
      <div class="vong" id="cheVong"></div>
      <div id="cheTieuDe">Đang mở camera…</div>
      <div id="cheChu"></div>
      <div id="cheNut"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ===================================================================
     Camera QC — Cổng C
     Trang HTTPS độc lập trên GitHub Pages. KHÔNG có file picker: ảnh chỉ
     đến từ getUserMedia -> canvas. Watermark được đóng vào PIXEL trước
     khi tải lên, nên ảnh lưu trong hồ sơ luôn mang đủ năm thông tin.

     Vé và URL API đi qua HASH FRAGMENT (#), không qua query string: hash
     không bao giờ được gửi tới máy chủ, nên không lọt vào log của GitHub
     Pages. Vé chứa họ tên và email người chụp.
     =================================================================== */

  var CANH_DAI_MAX = 1600;          // khớp giới hạn 3 MB của API
  var CHAT_LUONG = 0.82;
  var GPS_CHO_MS = 12000;           // chờ định vị lần đầu
  var DIA_DANH_CHO_MS = 1200;       // chờ địa danh ngay trước khi vẽ, có chặn trên

  var DINH_VI = {
    CO_DIA_DANH: 'CO_DIA_DANH', CHUA_RO_DIA_DANH: 'CHUA_RO_DIA_DANH',
    KHONG_CO_GPS: 'KHONG_CO_GPS', TU_CHOI_QUYEN: 'TU_CHOI_QUYEN'
  };

  /* =============== Hàm thuần — bộ kiểm thử gọi trực tiếp =============== */

  /** Bốn trạng thái định vị PO đã chốt. `loiMa` là code của GeolocationPositionError. */
  function trangThaiDinhVi_(viTri, loiMa, diaDanh) {
    if (loiMa === 1) {
      return { ma: DINH_VI.TU_CHOI_QUYEN, nhan: 'Người dùng từ chối cấp quyền ghi vị trí' };
    }
    if (!viTri || !isFinite(viTri.lat) || !isFinite(viTri.lng)) {
      return { ma: DINH_VI.KHONG_CO_GPS, nhan: 'Không rõ địa điểm ghi hình' };
    }
    var toaDo = moTaToaDo_(viTri);
    if (diaDanh) {
      return { ma: DINH_VI.CO_DIA_DANH, nhan: diaDanh + ' ' + toaDo };
    }
    return { ma: DINH_VI.CHUA_RO_DIA_DANH, nhan: 'Chưa xác định địa danh ' + toaDo };
  }

  function moTaToaDo_(viTri) {
    var s = '(' + Number(viTri.lat).toFixed(6) + ', ' + Number(viTri.lng).toFixed(6);
    if (isFinite(viTri.do_chinh_xac)) s += ' ±' + Math.round(viTri.do_chinh_xac) + 'm';
    return s + ')';
  }

  function hai_(n) { return (n < 10 ? '0' : '') + n; }

  /** Giờ địa phương của thiết bị, định dạng người Việt đọc được. */
  function dinhDangGio_(ms) {
    var d = new Date(ms);
    return hai_(d.getDate()) + '/' + hai_(d.getMonth() + 1) + '/' + d.getFullYear() +
           ' ' + hai_(d.getHours()) + ':' + hai_(d.getMinutes()) + ':' + hai_(d.getSeconds());
  }

  /** Năm thông tin đóng vào ảnh. Thứ tự này là thứ tự vẽ từ trên xuống. */
  function dongWatermark_(ve, thoiDiemMs, dinhViNhan) {
    return [
      String(ve.ma_phieu || '—') + '  ·  ' + String(ve.vai_tro || '—'),
      String(ve.ho_ten || '—'),
      dinhDangGio_(thoiDiemMs),
      String(dinhViNhan || 'Không rõ địa điểm ghi hình')
    ];
  }

  /** Ngắt dòng theo chiều rộng thật của chữ trên canvas. */
  function ngatDong_(ctx, chu, rongToiDa) {
    var tu = String(chu).split(/\s+/), ds = [], d = '';
    for (var i = 0; i < tu.length; i++) {
      var thu = d ? d + ' ' + tu[i] : tu[i];
      if (ctx.measureText(thu).width <= rongToiDa || !d) { d = thu; }
      else { ds.push(d); d = tu[i]; }
    }
    if (d) ds.push(d);
    return ds;
  }

  /* =============== Trạng thái =============== */

  var E = function (id) { return document.getElementById(id); };
  var stream = null, ve = null, apiUrl = '', neo = null;
  var viTri = null, gpsLoiMa = 0, diaDanh = '', dangTraDiaDanh = null;
  var anhHienTai = null, khoaHienTai = '', daLuu = 0, dangLuu = false;
  var metaHienTai = null;      // metadata DONG BANG tai nhip bam may
  var maTieuChi = '';

  /* =============== Che phủ & thông báo =============== */

  function che(tieuDe, chu, nutHtml, quay) {
    E('cheTieuDe').textContent = tieuDe;
    E('cheChu').textContent = chu || '';
    E('cheNut').innerHTML = nutHtml || '';
    E('cheVong').style.display = quay ? 'block' : 'none';
    E('che').classList.add('hien');
  }
  function heChe() { E('che').classList.remove('hien'); }

  var banhHen = 0;
  function banh(chu, loi) {
    var b = E('banh');
    b.textContent = chu;
    b.className = 'hien' + (loi ? ' loi' : '');
    clearTimeout(banhHen);
    banhHen = setTimeout(function () { b.className = loi ? 'loi' : ''; }, loi ? 5200 : 2600);
  }

  /* =============== Vé =============== */

  function giaiB64Url_(s) {
    var t = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    return decodeURIComponent(Array.prototype.map.call(atob(t), function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  }

  function docThamSo_() {
    var h = String(location.hash || '').replace(/^#/, '');
    var o = {};
    h.split('&').forEach(function (p) {
      var i = p.indexOf('=');
      if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1));
    });
    return o;
  }

  function napVe_() {
    var ts = docThamSo_();
    if (!ts.ve || !ts.api) return 'Thiếu tham số';
    var than = String(ts.ve).split('.')[0];
    var p = JSON.parse(giaiB64Url_(than));
    ve = p; ve._chuoi = ts.ve;
    apiUrl = ts.api;
    if (!/^https:\/\/script\.google\.com\//.test(apiUrl)) return 'Địa chỉ API không hợp lệ';
    // Neo giờ theo `iat` do máy chủ phát, cộng thời gian đã trôi kể từ lúc tải
    // trang. Nhờ vậy giờ đóng vào ảnh không phụ thuộc đồng hồ thiết bị.
    neo = { goc: Number(p.iat) * 1000, moc: now_() };
    // Tiêu chí đang cần ảnh — chỉ là NHÃN để xếp ảnh vào đúng mục, không phải
    // quyền. Vé không ký trường này vì cổng nhận ảnh @6 đọc nó từ thân yêu
    // cầu; mức độ tin cậy giữ nguyên như đường chụp cũ (cũng do client khai).
    maTieuChi = String(ts.tc || '').slice(0, 40);
    return '';
  }

  function now_() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }
  /** Giờ ghi hình: neo theo máy chủ, không theo đồng hồ máy. */
  function gioGhiHinh_() {
    if (!neo || !isFinite(neo.goc)) return Date.now();
    return neo.goc + (now_() - neo.moc);
  }
  function conHan_() {
    return !ve || !isFinite(ve.exp) || gioGhiHinh_() < Number(ve.exp) * 1000;
  }

  /* =============== Định vị =============== */

  function veChipGps() {
    var t = trangThaiDinhVi_(viTri, gpsLoiMa, diaDanh);
    var lop = t.ma === DINH_VI.CO_DIA_DANH ? 'ok'
            : t.ma === DINH_VI.CHUA_RO_DIA_DANH ? 'cho' : 'khong';
    var c = E('chipGps');
    c.className = 'chip ' + lop;
    c.querySelector('u').textContent = t.nhan;
  }

  function batDinhVi() {
    if (!navigator.geolocation) { gpsLoiMa = 2; veChipGps(); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      gpsLoiMa = 0;
      viTri = { lat: p.coords.latitude, lng: p.coords.longitude,
                do_chinh_xac: p.coords.accuracy, thoi_diem: p.timestamp };
      veChipGps();
      hoiDiaDanh();
    }, function (e) {
      gpsLoiMa = (e && e.code) || 2;      // 1 = từ chối quyền
      veChipGps();
    }, { enableHighAccuracy: true, timeout: GPS_CHO_MS, maximumAge: 30000 });
  }

  /** Hỏi địa danh qua API. Thất bại thì im lặng — trạng thái 2 vẫn hợp lệ. */
  function hoiDiaDanh() {
    if (!viTri || diaDanh || dangTraDiaDanh) return;
    dangTraDiaDanh = goiApi({ viec: 'dia_danh', ve: ve._chuoi,
                              lat: viTri.lat, lng: viTri.lng })
      .then(function (r) {
        if (r && r.ok && r.ket_qua && r.ket_qua.dia_danh) {
          diaDanh = String(r.ket_qua.dia_danh);
          veChipGps();
        }
      })
      .catch(function () { /* địa danh chỉ là tiện ích */ })
      .then(function () { dangTraDiaDanh = null; });
    return dangTraDiaDanh;
  }

  /**
   * Anh chup metadata tai nhip bam may — DUNG nhung gia tri da dung de dung
   * watermark, khong hon khong kem.
   *
   * `chup_luc` lay tu gioGhiHinh_(), tuc NEO theo `iat` cua ve: `iat` do may
   * chu QA/QC dat va nam trong than ve DA KY HMAC, con phan troi la dong ho
   * DON DIEU performance.now(). Doi gio thiet bi khong lam lech duoc no.
   */
  function anhChupMeta_(chupLuc) {
    var t = trangThaiDinhVi_(viTri, gpsLoiMa, diaDanh);
    var m = { trang_thai: t.ma, chup_luc: chupLuc };
    if (viTri) {
      m.lat = viTri.lat; m.lng = viTri.lng;
      m.do_chinh_xac = viTri.do_chinh_xac; m.thoi_diem = viTri.thoi_diem;
    }
    // Chi gui dia danh khi THAT SU co. Khong co thi bo han khoa — de may chu
    // ghi trong, chu khong ghi mot chuoi rong gia lam "da tra cuu".
    if (diaDanh) m.dia_danh = String(diaDanh);
    return m;
  }

  /** Meta de gui len. Chua chup thi tra trang thai hien tai (khong co anh). */
  function gpsGuiLen_() {
    if (metaHienTai) return metaHienTai;
    return { trang_thai: trangThaiDinhVi_(viTri, gpsLoiMa, diaDanh).ma };
  }

  /* =============== Camera =============== */

  /** Trang bi nhung trong iframe ma khong duoc cap allow="camera" thi
      getUserMedia bao NotAllowedError y nhu khi nguoi dung tu choi. Phan biet
      duoc hai cai nay la bai hoc cua C0: dung bat nguoi dung di sua Cai dat
      khi loi thuc ra nam o trang nhung. */
  function trongIframe_() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }
  function chinhSachChanCamera_() {
    try {
      return !!(document.featurePolicy && document.featurePolicy.allowsFeature &&
                !document.featurePolicy.allowsFeature('camera'));
    } catch (e) { return false; }
  }

  function moCamera() {
    if (!window.isSecureContext) {
      return che('Trang phải chạy trên HTTPS',
                 'Trình duyệt chỉ cho mở camera trên kết nối an toàn. Hãy mở trang ' +
                 'này bằng đường dẫn https://.', '', false);
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return che('Thiết bị không hỗ trợ camera',
                 'Trình duyệt này không cho phép mở camera trực tiếp. Hãy dùng Safari ' +
                 'hoặc Chrome bản mới trên điện thoại.', '', false);
    }
    che('Đang mở camera…', 'Hãy cho phép truy cập camera khi được hỏi.', '', true);
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' },
               width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (s) {
      stream = s;
      var v = E('video');
      v.srcObject = s;
      return v.play().catch(function () {});
    }).then(function () {
      heChe();
      veLive();
    }).catch(function (e) {
      loiCamera(e);
    });
  }

  function loiCamera(e) {
    var ten = (e && e.name) || 'Lỗi';
    var chu, nut = '<button class="nut" type="button" id="thuLai">Thử mở lại camera</button>' +
                   NUT_QUAY_VE;
    if (ten === 'NotAllowedError' && (trongIframe_() || chinhSachChanCamera_())) {
      chu = 'Trang đang bị nhúng trong một trang khác và trang đó không cho phép ' +
            'dùng camera.\n\nHãy mở Camera QC bằng đường dẫn riêng trên Safari ' +
            'hoặc Chrome, đừng mở trong khung nhúng.';
    } else if (ten === 'NotAllowedError') {
      chu = 'Bạn đã từ chối quyền camera, hoặc trình duyệt đang chặn.\n\n' +
            'iPhone: Cài đặt → Safari → Camera → Cho phép. Sau đó tải lại trang.';
    } else if (ten === 'NotFoundError' || ten === 'OverconstrainedError') {
      chu = 'Không tìm thấy camera phù hợp trên thiết bị này.';
    } else if (ten === 'NotReadableError') {
      chu = 'Camera đang bị ứng dụng khác chiếm. Hãy đóng ứng dụng đó rồi thử lại.';
    } else {
      chu = 'Không mở được camera (' + ten + ').';
    }
    che('Không mở được camera', chu, nut, false);
    var b = E('thuLai');
    if (b) b.onclick = function () { moCamera(); };
  }

  function dongCamera() {
    if (!stream) return;
    stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }

  /* =============== Giao diện theo bước =============== */

  function veDem() {
    E('demAnh').textContent = daLuu ? 'Đã lưu ' + daLuu + ' ảnh' : '';
  }

  function veLive() {
    E('video').style.display = '';
    E('video').classList.add('day');
    E('anh').style.display = 'none';
    E('duoiChinh').innerHTML = '<button id="chup" type="button" aria-label="Chụp ảnh"></button>';
    E('chup').onclick = chup;
    veDem();
    veChipGps();
  }

  function veXemLai(dataUrl) {
    E('video').style.display = 'none';
    var im = E('anh');
    im.src = dataUrl;
    im.style.display = '';
    E('duoiChinh').innerHTML =
      '<button class="nut" type="button" id="lai">Chụp lại</button>' +
      '<button class="nut nut-chinh" type="button" id="luu">Lưu QC</button>';
    E('lai').onclick = chupLai;
    E('luu').onclick = luuQc;
    veDem();
  }

  /* =============== Chụp & đóng dấu =============== */

  function chup() {
    var v = E('video');
    if (!v.videoWidth) return banh('Camera chưa sẵn sàng, thử lại sau một giây.', true);
    if (!conHan_()) return hetHan();

    var thoiDiem = gioGhiHinh_();
    E('chup').disabled = true;

    // Chờ địa danh một khoảng CÓ CHẶN TRÊN rồi vẽ. Thiếu địa danh vẫn chụp.
    var cho = (viTri && !diaDanh && dangTraDiaDanh)
      ? Promise.race([dangTraDiaDanh, nghi_(DIA_DANH_CHO_MS)])
      : Promise.resolve();

    cho.then(function () {
      var dataUrl = veAnhCoDau_(v, thoiDiem);
      anhHienTai = dataUrl;
      khoaHienTai = sinhKhoa_();
      // DONG BANG metadata o DUNG thoi diem dung watermark.
      //
      // Khong doc lai luc bam Luu: giua chup va luu, GPS co the cap nhat hoac
      // dia danh moi ve. Luu gia tri khac voi gia tri da in len anh thi bang
      // ANH va pixel noi hai dieu khac nhau — do la mau thuan bang chung.
      metaHienTai = anhChupMeta_(thoiDiem);
      dongCamera();
      veXemLai(dataUrl);
    }).catch(function (e) {
      E('chup').disabled = false;
      banh('Không chụp được: ' + ((e && e.message) || e), true);
    });
  }

  function nghi_(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function sinhKhoa_() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  /** Vẽ khung hình ra canvas rồi ĐÓNG WATERMARK VÀO PIXEL. */
  function veAnhCoDau_(v, thoiDiem) {
    var w = v.videoWidth, h = v.videoHeight;
    var ti = Math.min(1, CANH_DAI_MAX / Math.max(w, h));
    w = Math.round(w * ti); h = Math.round(h * ti);

    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, w, h);

    var t = trangThaiDinhVi_(viTri, gpsLoiMa, diaDanh);
    var dong = dongWatermark_(ve, thoiDiem, t.nhan);

    // Co chu neo theo CANH NGAN, khong theo be ngang. Neo theo be ngang thi
    // tren anh ngang 16:9 khoi chu an mat hon mot phan ba khung hinh — che
    // chinh thu can chup. Theo canh ngan thi anh ngang va anh doc deu ~10-20%.
    var canhNgan = Math.min(w, h);
    var co = Math.max(13, Math.round(canhNgan * 0.028));
    var leNgang = Math.round(w * 0.025);
    var leDoc = Math.round(co * 0.7);
    var caoDong = Math.round(co * 1.34);

    ctx.font = '600 ' + co + 'px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textBaseline = 'top';

    // Ngắt dòng dài (địa danh) theo chiều rộng thật.
    var tatCa = [];
    dong.forEach(function (d) {
      ngatDong_(ctx, d, w - leNgang * 2).forEach(function (x) { tatCa.push(x); });
    });

    var caoKhoi = caoDong * tatCa.length + leDoc * 2;
    var y0 = h - caoKhoi;

    // Dải tối phía dưới để chữ đọc được trên mọi nền.
    var g = ctx.createLinearGradient(0, y0 - caoDong, 0, h);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.35, 'rgba(0,0,0,.52)');
    g.addColorStop(1, 'rgba(0,0,0,.74)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y0 - caoDong, w, caoKhoi + caoDong);

    // Hai lớp: viền tối + chữ sáng. Đọc được cả khi dải bị nền sáng lấn.
    ctx.lineWidth = Math.max(2, co * 0.16);
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.fillStyle = '#ffffff';

    var y = y0 + leDoc;
    tatCa.forEach(function (d) {
      ctx.strokeText(d, leNgang, y);
      ctx.fillText(d, leNgang, y);
      y += caoDong;
    });

    return c.toDataURL('image/jpeg', CHAT_LUONG);
  }

  function chupLai() {
    anhHienTai = null; khoaHienTai = ''; metaHienTai = null;
    moCamera();
  }

  /* =============== Lưu =============== */

  function goiApi(than) {
    return fetch(apiUrl, {
      method: 'POST',
      // text/plain tránh preflight CORS — Apps Script không trả preflight.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(than),
      redirect: 'follow'
    }).then(function (r) { return r.json(); });
  }

  function luuQc() {
    if (dangLuu || !anhHienTai) return;
    if (!conHan_()) return hetHan();
    var khoaDaGui = khoaHienTai;      // giữ lại để còn hỏi kết cục
    dangLuu = true; capNhatNutQuayVe_();
    E('luu').disabled = true; E('lai').disabled = true;
    che('Đang lưu ảnh vào hồ sơ…', 'Giữ màn hình mở cho tới khi xong.', '', true);

    goiApi({
      viec: 'tai_anh', ve: ve._chuoi,
      ma_phieu: ve.ma_phieu, ma_bao_cao: ve.ma_bao_cao,
      ma_tieu_chi: maTieuChi,
      khoa: khoaHienTai, du_lieu: anhHienTai,
      gps: gpsGuiLen_()
    }).then(function (r) {
      dangLuu = false; capNhatNutQuayVe_();
      if (r && r.ok) {
        daLuu++;
        anhHienTai = null; metaHienTai = null;
        heChe();
        // "Đã tiếp nhận" KHÁC "đã vào hồ sơ". Cổng camera chỉ nhận ảnh và
        // xếp hàng; việc ảnh có thuộc hồ sơ QC hay không do QA/QC quyết.
        banh(r.anh && r.anh.da_co_tu_truoc
          ? 'Ảnh này đã gửi trước đó.'
          : 'Đã nhận ảnh, đang ghi vào hồ sơ…');
        // Máy chủ ĐÃ ACK — từ đây người dùng được phép rời đi. Không chờ
        // THANH_CONG: ảnh còn ở CHO_GHI, và việc duyệt xảy ra bên QA/QC.
        hienNutQuayVe();
        theoDoiKetCuc(khoaDaGui);
        moCamera();
        return;
      }
      loiLuu((r && r.loi) || 'Máy chủ từ chối, không rõ lý do.');
    }).catch(function (e) {
      dangLuu = false; capNhatNutQuayVe_();
      loiLuu('Không gửi được lên máy chủ. Kiểm tra mạng rồi thử lại.\n\n' +
             ((e && e.message) || e));
    });
  }

  /* Bốn trạng thái PO chốt. Cổng camera KHÔNG quyết định — nó chỉ thuật lại
     những gì QA/QC đã ghi. Hỏi vài lần rồi thôi: chậm nhất thì trigger định
     kỳ của QA/QC cũng xử lý trong vài phút, và ảnh không mất đi đâu. */
  var NHIP_HOI = [2500, 4000, 7000, 12000];

  function theoDoiKetCuc(khoa) {
    if (!khoa) return;
    var lan = 0;
    (function hoi() {
      // Het nhip hoi ma anh CHUA co ket cuc: noi ro phai lam gi, dung im lang.
      //
      // Khoang hoi toi da ~25,5 giay, con viec duyet CHO_GHI xay ra khi nguoi
      // dung nop bao cao, mo lai danh sach anh, hoac trigger 5 phut chay. Hai
      // khoang nay lech nhau mot bac do lon (docs/53 muc 29.5). KHONG keo dai
      // polling thanh 5 phut — giu may chu nhan roi, va chi dan nguoi dung ve
      // dung cho co cau tra loi.
      if (lan >= NHIP_HOI.length) {
        return banh('Ảnh đang được xử lý. Vui lòng quay lại báo cáo QC và ' +
                    'làm mới danh sách ảnh để kiểm tra kết quả.');
      }
      if (!conHan_()) return;
      var cho = NHIP_HOI[lan++];
      setTimeout(function () {
        goiApi({ viec: 'trang_thai_anh', ve: ve._chuoi, khoa: khoa })
          .then(function (r) {
            var a = r && r.ok && r.anh;
            if (!a || !a.co) return hoi();
            if (a.trang_thai === 'THANH_CONG') {
              return banh('Đã lưu vào hồ sơ QC: ' + (a.ten_file || ''));
            }
            if (a.trang_thai === 'BI_TU_CHOI') {
              return banh('Ảnh không được ghi: báo cáo đã chốt trước khi ảnh kịp vào.', true);
            }
            if (a.trang_thai === 'NHAN_KHONG_HOP_LE') {
              return banh('Ảnh chưa được chấp nhận vì tiêu chí kiểm tra không hợp lệ. ' +
                          'Vui lòng quay lại báo cáo QC và chụp lại.', true);
            }
            if (a.trang_thai === 'LOI') {
              return banh('Tải ảnh thất bại. Hãy chụp lại.', true);
            }
            // CHUA ket thuc — DANG_TAI hoac CHO_GHI. KHONG bao thanh cong o
            // day: "da tiep nhan" khac "da vao ho so". Hoi tiep, va `hoi()` tu
            // dung khi het NHIP_HOI nen khong co vong hoi vo han.
            hoi();
          })
          .catch(function () { hoi(); });
      }, cho);
    })();
  }

  function loiLuu(chu) {
    che('Chưa lưu được ảnh', chu,
        '<button class="nut nut-chinh" type="button" id="thuLuu">Thử lưu lại</button>' +
        '<button class="nut" type="button" id="boAnh">Bỏ ảnh này</button>' +
        NUT_QUAY_VE, false);
    E('thuLuu').onclick = function () {
      heChe();
      E('luu').disabled = false; E('lai').disabled = false;
      luuQc();                        // CÙNG khóa — máy chủ chống trùng
    };
    E('boAnh').onclick = function () { heChe(); chupLai(); };
  }

  function hetHan() {
    dongCamera();
    che('Phiên chụp đã hết hạn',
        'Vé chụp ảnh chỉ có hiệu lực trong thời gian ngắn. Hãy quay lại ứng dụng ' +
        'QA/QC và bấm “Chụp ảnh” để mở lại trang này.', NUT_QUAY_VE, false);
  }

  /* =============== Quay về QA/QC ===============

     Tab này do QA/QC mở bằng window.open(), KHÔNG kèm noopener — nên nó là tab
     "script-closable" và window.close() được phép. Đóng tab là cách DUY NHẤT
     đưa người dùng về ĐÚNG tab QA/QC đang mở: nó giữ nguyên báo cáo và bước 4
     của wizard, không tạo lại phiếu, không mở thêm tab.

     KHÔNG điều hướng tới URL QA/QC: làm thế là mở thêm một tab/phiên thứ hai,
     và URL quay về sẽ phải mang theo thứ gì đó để định vị lại báo cáo. Ở đây
     không có URL quay về nào, nên cũng không có chỗ nào để lọt token phiên hay
     vé HMAC.

     KHÔNG tự gọi khi ảnh vừa ACK: chỉ chạy khi người dùng BẤM. Ảnh mới ở
     CHO_GHI, chưa phải THANH_CONG — đóng tab hộ người dùng là vừa cướp quyền
     quyết định vừa dễ bị hiểu là "đã xong".

     Safari/Chrome trên iPhone KHÔNG bảo đảm cho đóng tab: nếu người dùng tới
     đây bằng liên kết dự phòng (rel="noopener") thì tab không script-closable.
     Nên luôn kiểm lại và có đường đi tiếp bằng thao tác tay. */
  var NUT_QUAY_VE =
    '<button class="nut nut-chinh" type="button" data-quay-ve>← Quay về QA/QC</button>';

  function quayVeQaQc() {
    try { window.close(); } catch (e) { /* vài trình duyệt ném thay vì lờ đi */ }
    // window.close() không đồng bộ ở mọi nơi — chờ một nhịp rồi mới kết luận.
    setTimeout(function () {
      if (window.closed) return;
      che('Hãy chuyển về tab QA/QC',
          'Trình duyệt không cho trang này tự đóng. Tab QA/QC vẫn đang mở — ' +
          'hãy chuyển sang tab đó, rồi bấm “Làm mới ảnh” để thấy ảnh vừa chụp.',
          '<button class="nut" type="button" id="oLaiDay">Ở lại trang chụp</button>',
          false);
      var n = E('oLaiDay');
      if (n) n.onclick = function () { heChe(); if (conHan_()) moCamera(); };
    }, 400);
  }

  /* Uỷ quyền sự kiện: nút quay về được vẽ lại nhiều lần trong lớp che. */
  document.addEventListener('click', function (ev) {
    var n = ev.target && ev.target.closest && ev.target.closest('[data-quay-ve]');
    if (n) { ev.preventDefault(); quayVeQaQc(); }
  });

  /** Hiện nút quay về ở vùng thao tác. Gọi khi đã ACK hoặc khi người dùng dừng. */
  function hienNutQuayVe() {
    var n = E('quayVe');
    if (n) n.hidden = false;
    var d = E('duoi');
    if (d) d.classList.add('co-quay-ve');
    capNhatNutQuayVe_();
  }

  /**
   * Khoá nút trong lúc đang gửi ảnh.
   *
   * Rời trang giữa chừng là để người dùng tin ảnh đã lưu trong khi yêu cầu còn
   * đang bay — chưa có ACK thì chưa có gì chắc chắn. Khoá nút là cách nói điều
   * đó mà không phải dựng thêm hộp thoại.
   */
  function capNhatNutQuayVe_() {
    var n = E('quayVe');
    if (!n) return;
    n.disabled = !!dangLuu;
    n.textContent = dangLuu ? 'Đang gửi ảnh…' : '← Quay về QA/QC';
  }

  /* =============== Khởi động =============== */

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) dongCamera();
    else if (!anhHienTai && conHan_() && !dangLuu) moCamera();
  });

  window.addEventListener('pagehide', dongCamera);

  var loiVe = '';
  try { loiVe = napVe_(); } catch (e) { loiVe = 'Vé không đọc được'; }

  if (loiVe) {
    che('Không mở được phiên chụp',
        loiVe + '.\n\nHãy mở trang này từ ứng dụng QA/QC bằng nút “Chụp ảnh”, ' +
        'đừng mở trực tiếp bằng đường dẫn.', '', false);
  } else if (!conHan_()) {
    hetHan();
  } else {
    E('nhanPhieu').innerHTML =
      String(ve.ma_phieu || '—') + ' <span>·</span> ' + String(ve.vai_tro || '—') +
      ' <span>·</span> <span>' + String(ve.ho_ten || '') + '</span>';
    batDinhVi();
    moCamera();
  }
})();
</script>
